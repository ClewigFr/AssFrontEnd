server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # The build ships a .gz of each text file (see vite.config.js): served as is.
    # gzip on stays as a fallback for files without one.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Built files have a content hash in their name: cache them for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }
    # index.html must always be fresh, so a new version is picked up at once
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;
        # Served over HTTPS only (Cloudflare in front); HSTS is ignored on plain HTTP anyway
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        # No framing (clickjacking on the delete buttons). Inline styles: Vue style bindings (share bars, tooltip).
        add_header X-Frame-Options DENY;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' __BACKEND_URL__; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
        try_files $uri $uri/ @app;
    }
    # An instance without legal pages (public/legal/ not filled in): an empty list, not a 404
    location = /legal/pages.json {
        try_files $uri @no_legal_pages;
    }
    location @no_legal_pages {
        default_type application/json;
        add_header Cache-Control "no-cache";
        return 200 '[]';
    }
    # The app's routes (src/router/index.js, keep both lists in step) get index.html.
    # Anything else is a real 404, still with the app's page so visitors see "Page introuvable":
    # search engines don't index those addresses as empty duplicates of the home page.
    location @app {
        if ($uri ~ "^/(login|register|verify|forgot|reset|legal|privacy|terms|apps|apps/[^/]+|account|stats)/?$") {
            rewrite ^ /index.html last;
        }
        return 404;
    }
    error_page 404 /index.html;
}
